name: Publish verified ScreenPilot release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build and verify ScreenPilot workflow run ID
        required: true
        default: "0"
      release_tag:
        description: GitHub release tag
        required: true
        default: v0.4.6

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified installers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenpilot-v0.4.6-verified-release
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}

      - name: Verify release assets
        working-directory: release-assets
        run: |
          test -s ScreenPilot-macOS.app.zip
          test -s ScreenPilot-macOS.dmg
          test -s ScreenPilot-Windows-Setup.exe
          test -s ScreenPilot-Android.apk
          test -s SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ScreenPilot v0.4.6 places the permitted display capture at the center
          of the monitor. The dashboard now shows the real in-memory display
          image being analyzed, with visible errors, OCR evidence, and
          foreground context separated clearly.

          PaddleOCR runs first against full-display pixels. Clear visible text
          is surfaced immediately, and high-confidence visible errors or dialogs
          skip the slower visual-model path. This makes common desktop frames and
          visible failures respond much faster while keeping Moondream available
          for sparse visual-only screens. Unreliable or malformed Moondream
          completions fall back to local OCR evidence instead of emitting a vague
          or unrelated summary.

          A visible application-memory alert now creates a precise local
          notification and a high-priority suggestion. Other suggestions still
          require explicit visible evidence and remain on-device.

          The overview has been redesigned as a live display monitor. Raw image
          data is held only in memory, refreshed from the full display, and
          cleared immediately for private or ignored frames.

          Capture access is requested only after the user selects Start
          monitoring. macOS relaunches once when TCC requires a new process, then
          automatically resumes monitoring. Windows continues to use its desktop
          capture API, and Android continues through the system screen-share
          consent dialog.

          The macOS and Windows packages physically include the open-source
          PaddleOCR model files, Moondream GGUF weights, and local llama.cpp
          runtimes. The application verifies those files, shows setup progress,
          and processes captured frames locally. Model weights are not downloaded
          after installation, and no paid AI API is required.

          Notes:
          - The macOS DMG is the simple installer: open it and drag ScreenPilot
            into Applications before granting Screen Recording access.
          - macOS is ad-hoc signed and not Apple-notarized. Control-click the
            app once and choose Open if macOS asks for confirmation.
          - Windows is not code-signed, so SmartScreen may show a warning.
          - The Android APK is included, but Android does not support the same
            unrestricted desktop screen-monitoring workflow.
          - An iOS IPA is not provided because iOS does not permit an app to
            continuously inspect the screens of other apps.

          Verified by GitHub Actions build run ${{ inputs.build_run_id }}.
          EOF

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ScreenPilot v0.4.6" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ScreenPilot v0.4.6" \
              --notes-file release-notes.md
          fi

          gh release upload "$TAG" \
            release-assets/ScreenPilot-macOS.app.zip \
            release-assets/ScreenPilot-macOS.dmg \
            release-assets/ScreenPilot-Windows-Setup.exe \
            release-assets/ScreenPilot-Android.apk \
            release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
